{% load static %}
<header class="site-header" id="siteHeader">
  <div class="container header-inner">

    <!-- LOGO -->
    <a class="logo" href="#top" aria-label="Oromsoy Resort">
      <img src="{% static 'images/icons/logo.png' %}" alt="Oromsoy Resort">
      <span>Oromsoy Resort</span>
    </a>

    <!-- DESKTOP NAV -->
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#about">О Нас</a>
      <a href="#rooms">Номера</a>
      <a href="#activities">Активности</a>
      <a href="#dining">Ресторан</a>
      <a href="#contacts">Контакты</a>
    </nav>

    <!-- DESKTOP SOCIAL -->
    <div class="social" aria-label="Social links">
      <a href="#"><img src="{% static 'images/icons/insta.png' %}" alt="Instagram"></a>
      <a href="#"><img src="{% static 'images/icons/face.png' %}" alt="Facebook"></a>
      <a href="#"><img src="{% static 'images/icons/treds.png' %}" alt="Treds"></a>
      <a href="#"><img src="{% static 'images/icons/telega.png' %}" alt="Telegram"></a>
    </div>

    <!-- BURGER (mobile/tablet) -->
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
      <span></span>
    </button>
  </div>

  <!-- MOBILE OVERLAY (скрыт на десктопе полностью) -->
  <div class="mobile-menu" aria-hidden="true">
    <div class="mobile-menu-top">
      <a class="logo" href="#top" aria-label="Oromsoy Resort">
        <img src="{% static 'images/icons/logo.png' %}" alt="Oromsoy Resort">
        <span>Oromsoy Resort</span>
      </a>

      <button class="menu-close" type="button" aria-label="Close menu">✕</button>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="#about">ABOUT US</a>
      <a href="#rooms">ROOMS & SUITES</a>
      <a href="#activities">ACTIVITIES</a>
      <a href="#dining">DINNING BAR</a>
      <a href="#contacts">CONTACTS</a>
    </nav>

    <div class="mobile-social" aria-label="Mobile social links">
      <a href="#"><img src="{% static 'images/icons/insta.png' %}" alt="Instagram"></a>
      <a href="#"><img src="{% static 'images/icons/face.png' %}" alt="Facebook"></a>
      <a href="#"><img src="{% static 'images/icons/treds.png' %}" alt="Treds"></a>
      <a href="#"><img src="{% static 'images/icons/telega.png' %}" alt="Telegram"></a>
    </div>
  </div>
</header>
